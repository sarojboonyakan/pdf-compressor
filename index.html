<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Compressor - ย่อขนาด PDF หลายไฟล์พร้อมกัน</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', system-ui, -apple-system, sans-serif; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-bold text-blue-400 mb-2">
        <i class="fa-solid fa-file-pdf mr-2"></i>PDF Compressor (Batch)
      </h1>
      <p class="text-slate-400 text-sm md:text-base">ย่อขนาดไฟล์ PDF ได้ทีละหลายไฟล์ ปลอดภัย 100% ประมวลผลในเครื่องของคุณ</p>
    </header>

    <!-- Settings Card -->
    <div class="bg-slate-800 rounded-2xl p-6 mb-6 shadow-xl border border-slate-700">
      <label class="block font-medium mb-2 text-slate-300">ระดับการบีบอัด (Compression Quality)</label>
      <div class="grid grid-cols-3 gap-3">
        <button onclick="setQuality(0.4, this)" class="q-btn bg-slate-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-xl transition text-center font-medium">
          ย่อสูงสุด<br><span class="text-xs text-slate-400 font-normal">(ไฟล์เล็กสุด)</span>
        </button>
        <button onclick="setQuality(0.65, this)" class="q-btn bg-blue-600 text-sm py-2 px-3 rounded-xl transition text-center font-medium active-q">
          สมดุล<br><span class="text-xs text-blue-200 font-normal">(แนะนำ)</span>
        </button>
        <button onclick="setQuality(0.85, this)" class="q-btn bg-slate-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-xl transition text-center font-medium">
          ชัดสูง<br><span class="text-xs text-slate-400 font-normal">(เน้นความชัด)</span>
        </button>
      </div>
    </div>

    <!-- Drop Zone -->
    <div id="dropZone" 
         class="border-2 border-dashed border-slate-600 hover:border-blue-400 bg-slate-800/50 hover:bg-slate-800 rounded-2xl p-8 text-center cursor-pointer transition-all mb-6">
      <input type="file" id="fileInput" multiple accept="application/pdf" class="hidden">
      <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-400 mb-3"></i>
      <p class="text-lg font-medium text-slate-200">ลากไฟล์ PDF มาวางที่นี่ (เลือกได้หลายไฟล์)</p>
      <p class="text-sm text-slate-400 mt-1">หรือคลิกเพื่อเลือกไฟล์จากเครื่อง</p>
    </div>

    <!-- Actions & Control Bar -->
    <div id="controlBar" class="hidden flex justify-between items-center mb-4">
      <span id="totalStats" class="text-sm text-slate-300 font-medium"></span>
      <button id="downloadAllBtn" onclick="downloadAll()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium py-2 px-4 rounded-xl transition flex items-center gap-2">
        <i class="fa-solid fa-download"></i> ดาวน์โหลดทั้งหมด
      </button>
    </div>

    <!-- File List Container -->
    <div id="fileList" class="space-y-3"></div>
  </div>

  <script>
    let compressionQuality = 0.65;
    let processedFiles = [];

    function setQuality(val, btn) {
      compressionQuality = val;
      document.querySelectorAll('.q-btn').forEach(b => {
        b.classList.remove('bg-blue-600', 'active-q');
        b.classList.add('bg-slate-700');
      });
      btn.classList.remove('bg-slate-700');
      btn.classList.add('bg-blue-600', 'active-q');
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-400', 'bg-slate-800'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-blue-400', 'bg-slate-800'); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-400', 'bg-slate-800');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFiles(e.target.files);
    });

    async function handleFiles(files) {
      const pdfFiles = Array.from(files).filter(f => f.type === 'application/pdf');
      if (!pdfFiles.length) return alert('กรุณาเลือกไฟล์ .pdf เท่านั้นครับ');

      document.getElementById('controlBar').classList.remove('hidden');

      for (const file of pdfFiles) {
        await processFile(file);
      }
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(2) + ' MB';
    }

    async function processFile(file) {
      const fileId = 'file_' + Math.random().toString(36).substr(2, 9);
      
      // Create UI Item
      const itemEl = document.createElement('div');
      itemEl.id = fileId;
      itemEl.className = 'bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow';
      itemEl.innerHTML = `
        <div class="flex items-center gap-3 overflow-hidden">
          <i class="fa-solid fa-file-pdf text-red-400 text-2xl flex-shrink-0"></i>
          <div class="truncate">
            <p class="font-medium text-slate-200 truncate">${file.name}</p>
            <p class="text-xs text-slate-400">ขนาดต้นฉบับ: ${formatSize(file.size)}</p>
          </div>
        </div>
        <div id="status_${fileId}" class="flex items-center gap-3">
          <span class="text-xs text-blue-400 font-medium animate-pulse"><i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังย่อขนาด...</span>
        </div>
      `;
      fileList.prepend(itemEl);

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
        
        // Re-encode / rebuild document
        const newPdf = await PDFLib.PDFDocument.create();
        const pages = await newPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
        pages.forEach(p => newPdf.addPage(p));

        const compressedBytes = await newPdf.save({ useObjectStreams: true });
        const blob = new Blob([compressedBytes], { type: 'application/pdf' });
        const compressedSize = blob.size;
        const reduction = (((file.size - compressedSize) / file.size) * 100).toFixed(1);

        const downloadUrl = URL.createObjectURL(blob);
        const outputName = file.name.replace(/\.pdf$/i, '_compressed.pdf');

        processedFiles.push({ name: outputName, url: downloadUrl });

        const statusEl = document.getElementById(`status_${fileId}`);
        statusEl.innerHTML = `
          <div class="text-right mr-2">
            <p class="text-xs font-semibold text-emerald-400">เหลือ ${formatSize(compressedSize)} (${reduction > 0 ? '-' + reduction : '0'}%)</p>
          </div>
          <a href="${downloadUrl}" download="${outputName}" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium py-2 px-3 rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-download"></i> โหลด
          </a>
        `;

        if (processedFiles.length > 1) {
          document.getElementById('downloadAllBtn').classList.remove('hidden');
        }
      } catch (err) {
        console.error(err);
        document.getElementById(`status_${fileId}`).innerHTML = `
          <span class="text-xs text-red-400 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i> เกิดข้อผิดพลาด</span>
        `;
      }
    }

    function downloadAll() {
      processedFiles.forEach((file, index) => {
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = file.url;
          a.download = file.name;
          a.click();
        }, index * 300); // เว้นระยะดาวน์โหลดเล็กน้อยกันเบราว์เซอร์บล็อก
      });
    }
  </script>
</body>
</html>
